<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2F8"/>
      <stop offset="50%" stop-color="#F7F8FB"/>
      <stop offset="100%" stop-color="#EAF0FA"/>
    </linearGradient>
    <filter id="cardShadow" x="-12%" y="-12%" width="128%" height="132%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.11"/>
    </filter>
    <filter id="softShadow" x="-12%" y="-12%" width="128%" height="132%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="pillShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 浅色通透画布背景 -->
  <rect width="1200" height="700" rx="18" fill="url(#bgGrad)" stroke="#D9E1EE" stroke-width="1"/>

  <!-- 顶部标题带 -->
  <text x="40" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#181C24">MacPaste v1.1 · 全新浅色界面与核心交互总览</text>
  <rect x="820" y="19" width="340" height="26" rx="13" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="1"/>
  <text x="990" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'PingFang SC', monospace" font-size="11.5" font-weight="600" fill="#007AFF">⌥V 主面板 · F1 截图/翻译 · F3 桌面活贴图</text>

  <!-- ==================== 左侧：浅色主剪贴板窗口 (⌥V) ==================== -->
  <g transform="translate(42, 64)" filter="url(#cardShadow)">
    <rect width="450" height="602" rx="13" fill="#F7F8FB" stroke="#D5DCE8" stroke-width="1"/>

    <!-- 红绿灯融合标题栏行 (38pt) -->
    <circle cx="22" cy="19" r="5.5" fill="#FF5F57" stroke="#E0443E" stroke-width="0.6"/>
    <circle cx="40" cy="19" r="5.5" fill="#FEBC2E" stroke="#D89E24" stroke-width="0.6"/>
    <circle cx="58" cy="19" r="5.5" fill="#28C840" stroke="#1AAB29" stroke-width="0.6"/>
    <text x="76" y="23" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#5E6678">MacPaste</text>

    <!-- 同行右侧操作图标（搜索 / 截图 / 贴图 / 置顶 / 设置） -->
    <g transform="translate(298, 7)">
      <circle cx="12" cy="12" r="6" fill="none" stroke="#5E6678" stroke-width="1.5"/>
      <line x1="16.5" y1="16.5" x2="20" y2="20" stroke="#5E6678" stroke-width="1.6" stroke-linecap="round"/>

      <g transform="translate(29, 0)">
        <rect x="4" y="5" width="16" height="14" rx="3" fill="none" stroke="#5E6678" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="3" fill="none" stroke="#5E6678" stroke-width="1.5"/>
      </g>

      <g transform="translate(58, 0)">
        <rect x="3" y="5" width="14" height="10" rx="2" fill="none" stroke="#5E6678" stroke-width="1.4"/>
        <rect x="11" y="11" width="10" height="7" rx="1.5" fill="#5E6678"/>
      </g>

      <!-- 置顶高亮 -->
      <g transform="translate(87, 0)">
        <rect width="24" height="24" rx="6" fill="#FF9500" fill-opacity="0.14"/>
        <path d="M12 6 L15 9 L13.5 13 L15 15 L9 15 L10.5 13 L9 9 Z" fill="#FF9500"/>
        <line x1="12" y1="15" x2="12" y2="19.5" stroke="#FF9500" stroke-width="1.6" stroke-linecap="round"/>
      </g>

      <g transform="translate(116, 0)">
        <circle cx="12" cy="12" r="3.2" fill="none" stroke="#5E6678" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="6.8" fill="none" stroke="#5E6678" stroke-width="1.4" stroke-dasharray="2.4 2.2"/>
      </g>
    </g>

    <!-- 四项分段选择器 -->
    <g transform="translate(14, 44)">
      <rect width="422" height="28" rx="7" fill="#E9EDF5"/>
      <rect x="2" y="2" width="103" height="24" rx="5.5" fill="#FFFFFF" filter="url(#softShadow)"/>
      <text x="53.5" y="18" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" font-weight="600" fill="#181C24">短文本</text>
      <text x="158" y="18" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" font-weight="500" fill="#5E6678">长文本</text>
      <text x="263" y="18" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" font-weight="500" fill="#5E6678">图片</text>
      <text x="368" y="18" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" font-weight="500" fill="#5E6678">表格</text>
    </g>

    <line x1="0" y1="82" x2="450" y2="82" stroke="#E2E7F0" stroke-width="1"/>

    <!-- 卡片 1：按序粘贴激活态 -->
    <g transform="translate(14, 96)">
      <rect width="422" height="122" rx="10" fill="#F5F9FF" stroke="#007AFF" stroke-opacity="0.55" stroke-width="1.5" filter="url(#softShadow)"/>
      <rect x="12" y="12" width="66" height="20" rx="10" fill="#007AFF"/>
      <text x="45" y="26" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF">按序 2/4</text>
      <text x="86" y="26" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" fill="#5E6678">直接按 ⌘V 或点卡片依次粘贴</text>

      <!-- 右上微控钮 -->
      <circle cx="348" cy="22" r="9" fill="#FFFFFF" stroke="#DCE3EF"/>
      <text x="348" y="25.5" text-anchor="middle" font-size="9" fill="#5E6678">◀</text>
      <circle cx="369" cy="22" r="9" fill="#FFFFFF" stroke="#DCE3EF"/>
      <text x="369" y="25.5" text-anchor="middle" font-size="9" fill="#5E6678">▶</text>
      <circle cx="390" cy="22" r="9" fill="#FFFFFF" stroke="#DCE3EF"/>
      <text x="390" y="25.5" text-anchor="middle" font-size="9" fill="#5E6678">↺</text>
      <circle cx="410" cy="22" r="9" fill="#FFFFFF" stroke="#DCE3EF"/>
      <text x="410" y="25.5" text-anchor="middle" font-size="9" fill="#5E6678">✕</text>

      <text x="14" y="54" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#007AFF">当前：</text>
      <text x="52" y="54" font-family="ui-monospace, monospace" font-size="12.5" font-weight="500" fill="#181C24">git commit -m "feat: light ui redesign"</text>
      <text x="14" y="77" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5E6678">下一段（3/4）：git push origin main</text>
      <text x="14" y="104" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" fill="#8D95A5">刚刚 · 共 4 段</text>
    </g>

    <!-- 卡片 2：悬停态 + 右下角浮动操作胶囊 -->
    <g transform="translate(14, 230)">
      <rect width="422" height="90" rx="10" fill="#FAFCFF" stroke="#007AFF" stroke-opacity="0.32" stroke-width="1" filter="url(#softShadow)"/>
      <text x="14" y="28" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#181C24">SELECT user_id, plan_tier, created_at FROM accounts…</text>
      <text x="14" y="48" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#5E6678">WHERE status = 'active' ORDER BY created_at DESC;</text>
      <text x="14" y="72" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" fill="#8D95A5">2 分钟前 · 共 3 段</text>
      <rect x="88" y="58" width="60" height="18" rx="9" fill="#E8F2FF"/>
      <text x="118" y="71" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10" font-weight="600" fill="#007AFF">按序粘贴</text>

      <!-- 右下角浮现白色操作胶囊 -->
      <rect x="304" y="56" width="108" height="26" rx="7" fill="#FFFFFF" stroke="#DCE3EF" filter="url(#pillShadow)"/>
      <text x="319" y="73" text-anchor="middle" font-size="11" fill="#5E6678">🔢</text>
      <text x="345" y="73" text-anchor="middle" font-size="11" fill="#5E6678">🖼</text>
      <text x="371" y="73" text-anchor="middle" font-size="11" fill="#5E6678">📌</text>
      <text x="397" y="73" text-anchor="middle" font-size="11" fill="#FF3B30">🗑</text>
    </g>

    <!-- 卡片 3：普通已置顶卡片 -->
    <g transform="translate(14, 332)">
      <rect width="422" height="72" rx="10" fill="#FFFFFF" stroke="#E5E9F2" stroke-width="1"/>
      <text x="14" y="28" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#181C24">https://github.com/HunterLzap/Mac-paste/releases</text>
      <text x="14" y="53" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" fill="#8D95A5">18 分钟前</text>
      <path d="M402 10 L405 13 L403.5 16 L405 18 L399 18 L400.5 16 L399 13 Z" fill="#FF9500"/>
    </g>

    <!-- 卡片 4：普通短文本卡片 -->
    <g transform="translate(14, 416)">
      <rect width="422" height="72" rx="10" fill="#FFFFFF" stroke="#E5E9F2" stroke-width="1"/>
      <text x="14" y="28" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#181C24">xattr -cr /Applications/MacPaste.app</text>
      <text x="14" y="53" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" fill="#8D95A5">1 小时前</text>
    </g>

    <!-- 底部状态栏 -->
    <line x1="0" y1="564" x2="450" y2="564" stroke="#E2E7F0" stroke-width="1"/>
    <rect x="0" y="565" width="450" height="37" rx="0" fill="#FFFFFF" fill-opacity="0.72"/>
    <text x="16" y="588" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#5E6678">共 428 条</text>
    <text x="434" y="588" text-anchor="end" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" font-weight="500" fill="#FF3B30">清空历史</text>
  </g>

  <!-- ==================== 右上：Snipaste 级无顶栏活贴图 + 贴图外自动悬停工具栏 ==================== -->
  <g transform="translate(525, 64)">
    <!-- 贴图外上方悬停工具栏（带清晰中文标签） -->
    <g transform="translate(274, 0)" filter="url(#pillShadow)">
      <rect width="358" height="32" rx="9" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="1"/>
      <!-- 分段：原图 / 识字 / 翻译 -->
      <rect x="5" y="4" width="166" height="24" rx="6.5" fill="#F1F4F9"/>
      <rect x="7" y="6" width="52" height="20" rx="5" fill="#FFFFFF" filter="url(#softShadow)"/>
      <text x="33" y="20" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" font-weight="600" fill="#007AFF">🖼 原图</text>
      <text x="87" y="20" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" font-weight="500" fill="#5E6678">🔍 识字</text>
      <text x="141" y="20" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" font-weight="500" fill="#5E6678">译 翻译</text>

      <line x1="178" y1="8" x2="178" y2="24" stroke="#E2E7F0" stroke-width="1"/>

      <rect x="184" y="5" width="52" height="22" rx="5.5" fill="#F4F6FA"/>
      <text x="210" y="19.5" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" font-weight="500" fill="#5E6678">📄 复制</text>

      <rect x="241" y="5" width="52" height="22" rx="5.5" fill="#F4F6FA"/>
      <text x="267" y="19.5" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" font-weight="500" fill="#5E6678">⌃ 收起</text>

      <rect x="298" y="5" width="52" height="22" rx="5.5" fill="#F4F6FA"/>
      <text x="324" y="19.5" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" font-weight="500" fill="#5E6678">✕ 关闭</text>
    </g>

    <!-- 贴图主体（无任何内嵌顶栏，100% 展示内容） -->
    <g transform="translate(0, 40)" filter="url(#cardShadow)">
      <rect width="632" height="246" rx="11" fill="#FFFFFF" stroke="#007AFF" stroke-opacity="0.45" stroke-width="1.2"/>

      <!-- 内部内容：模拟大段文字 / 翻译对照 / 图片混合展示亮点 -->
      <text x="22" y="34" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#181C24">📌 桌面活贴图画布（F3 钉住 · 零顶栏无遮挡）</text>
      <rect x="444" y="16" width="166" height="22" rx="11" fill="#E8F2FF"/>
      <text x="527" y="31" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" font-weight="600" fill="#007AFF">⌥+滚轮 大段文字同样可缩放</text>

      <!-- 左侧原文 / 右侧译文示例 -->
      <rect x="22" y="52" width="286" height="142" rx="9" fill="#F7F8FB" stroke="#E4E9F2"/>
      <text x="36" y="74" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#5E6678">原文 · English</text>
      <text x="36" y="98" font-family="-apple-system, sans-serif" font-size="12.5" fill="#181C24">Select any screen region to translate</text>
      <text x="36" y="118" font-family="-apple-system, sans-serif" font-size="12.5" fill="#181C24">in-place, or pin long text &amp; images</text>
      <text x="36" y="138" font-family="-apple-system, sans-serif" font-size="12.5" fill="#181C24">with zoomable, drag-anywhere cards.</text>
      <text x="36" y="176" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" fill="#8D95A5">任意位置按住拖动窗口 · 按 ⌥+拖拽 划词</text>

      <rect x="324" y="52" width="286" height="142" rx="9" fill="#F5F9FF" stroke="#007AFF" stroke-opacity="0.28"/>
      <text x="338" y="74" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#007AFF">译文 · 简体中文（默认目标语言）</text>
      <text x="338" y="100" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#181C24">框选屏幕任意区域即可原地翻译，</text>
      <text x="338" y="122" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#181C24">或将长文本与截图固定为任意拖动、</text>
      <text x="338" y="144" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#181C24">滚轮缩放的桌面浮窗卡片。</text>
      <text x="338" y="176" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" fill="#007AFF">靠近屏幕顶部时，上方工具栏自动移至贴图下方</text>

      <!-- 底部功能提示条 -->
      <rect x="22" y="206" width="588" height="26" rx="7" fill="#F4F6FA"/>
      <text x="316" y="223" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5E6678">支持图片离线 Vision OCR「识字」· 文本「原文 / 分段 / 翻译 / 编辑」切换 · ⇧F3 一键显隐全部贴图</text>
    </g>
  </g>

  <!-- ==================== 右下：浅色 F1 交互式截图与原地翻译 ==================== -->
  <g transform="translate(525, 372)" filter="url(#cardShadow)">
    <rect width="632" height="294" rx="13" fill="#FFFFFF" stroke="#D5DCE8" stroke-width="1"/>

    <!-- 模拟桌面截取选区背景 -->
    <rect x="14" y="14" width="604" height="218" rx="9" fill="#F2F5FA" stroke="#007AFF" stroke-width="1.6"/>
    <!-- 8 方向白色蓝边手柄 -->
    <rect x="10" y="10" width="8" height="8" rx="2" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.5"/>
    <rect x="312" y="10" width="8" height="8" rx="2" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.5"/>
    <rect x="614" y="10" width="8" height="8" rx="2" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.5"/>
    <rect x="10" y="119" width="8" height="8" rx="2" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.5"/>
    <rect x="614" y="119" width="8" height="8" rx="2" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.5"/>
    <rect x="10" y="228" width="8" height="8" rx="2" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.5"/>
    <rect x="312" y="228" width="8" height="8" rx="2" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.5"/>
    <rect x="614" y="228" width="8" height="8" rx="2" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.5"/>

    <!-- 选区内展示：截图原地替换翻译 + 局部放大镜 -->
    <text x="32" y="42" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#181C24">F1 交互截图 · 浅色 HUD · 原地替换翻译 &amp; 滚动长截图</text>

    <!-- 原地译文覆盖示例块 -->
    <rect x="32" y="58" width="320" height="72" rx="8" fill="#FFFFFF" stroke="#E2E7F0"/>
    <rect x="44" y="70" width="82" height="18" rx="5" fill="#E8F2FF"/>
    <text x="85" y="83" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10" font-weight="600" fill="#007AFF">原地替换译文</text>
    <text x="136" y="83" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#181C24">自动采样原图底色与字号排版</text>
    <text x="44" y="112" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#5E6678">默认译为简体中文 · ▾ 下拉支持 24 种世界常用语言</text>

    <!-- 右侧颜色取色器 & 放大镜徽章 -->
    <g transform="translate(388, 54)" filter="url(#softShadow)">
      <rect width="210" height="148" rx="10" fill="#FFFFFF" stroke="#DCE3EF"/>
      <!-- 像素放大网格示意 -->
      <rect x="12" y="12" width="186" height="86" rx="6" fill="#EDF2FA" stroke="#D8E1EF"/>
      <line x1="12" y1="55" x2="198" y2="55" stroke="#007AFF" stroke-opacity="0.55" stroke-width="1"/>
      <line x1="105" y1="12" x2="105" y2="98" stroke="#007AFF" stroke-opacity="0.55" stroke-width="1"/>
      <rect x="99" y="49" width="12" height="12" fill="none" stroke="#007AFF" stroke-width="1.5"/>
      <rect x="12" y="108" width="18" height="18" rx="4" fill="#007AFF"/>
      <text x="38" y="121" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#181C24">#007AFF  RGB(0,122,255)</text>
      <text x="12" y="139" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" fill="#5E6678">按 C 键复制 HEX · 方向键 1px 微调</text>
    </g>

    <!-- 选区内置标注示意 -->
    <rect x="32" y="144" width="166" height="58" rx="7" fill="none" stroke="#FF3B30" stroke-width="2.2"/>
    <text x="115" y="177" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" font-weight="600" fill="#FF3B30">全矢量标注可随时二次拖拽/撤销</text>

    <!-- 底部浅色悬浮截图工具条 -->
    <g transform="translate(86, 242)" filter="url(#pillShadow)">
      <rect width="484" height="36" rx="10" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="1"/>
      <rect x="8" y="6" width="26" height="24" rx="6" fill="#E8F2FF"/>
      <text x="21" y="22" text-anchor="middle" font-size="12" fill="#007AFF">▭</text>
      <text x="48" y="22" text-anchor="middle" font-size="12" fill="#5E6678">◯</text>
      <text x="74" y="22" text-anchor="middle" font-size="12" fill="#5E6678">↗</text>
      <text x="100" y="22" text-anchor="middle" font-size="12" fill="#5E6678">✎</text>
      <text x="126" y="22" text-anchor="middle" font-size="12" fill="#5E6678">▓</text>
      <text x="152" y="22" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5E6678">Aa</text>
      <line x1="172" y1="9" x2="172" y2="27" stroke="#E2E7F0"/>
