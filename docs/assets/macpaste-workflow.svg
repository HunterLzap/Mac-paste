<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 270" width="1080" height="270">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#007AFF"/>
    </marker>
    <filter id="boxShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1080" height="270" rx="14" fill="#F7F8FB" stroke="#DCE3EF" stroke-width="1.2"/>

  <!-- Node 1 -->
  <g transform="translate(26, 36)" filter="url(#boxShadow)">
    <rect width="215" height="198" rx="10" fill="#FFFFFF" stroke="#E2E7F0" stroke-width="1.2"/>
    <text x="107" y="28" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#007AFF">输入捕获与全局热键</text>
    <line x1="16" y1="40" x2="199" y2="40" stroke="#E8EDF5"/>
    <text x="18" y="64" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• NSPasteboard (0.5s 轮询)</text>
    <text x="18" y="90" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• F1 交互式截图 &amp; 原地翻译</text>
    <text x="18" y="116" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• 镂空透传滚动长截图</text>
    <text x="18" y="142" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• F3 / ⇧F3 无顶栏活贴图</text>
    <text x="18" y="168" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#5E6678">• ⌥V 随时呼出独立主面板</text>
  </g>

  <line x1="241" y1="135" x2="288" y2="135" stroke="#007AFF" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Node 2 -->
  <g transform="translate(294, 36)" filter="url(#boxShadow)">
    <rect width="235" height="198" rx="10" fill="#FFFFFF" stroke="#E2E7F0" stroke-width="1.2"/>
    <text x="117" y="28" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#16A34A">解析、指纹与去重引擎</text>
    <line x1="16" y1="40" x2="219" y2="40" stroke="#E8EDF5"/>
    <text x="18" y="64" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• 文本自动分段 (&gt;100字长文本)</text>
    <text x="18" y="90" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• HTML &lt;table&gt; + TSV 双解析</text>
    <text x="18" y="116" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• 32×32 sRGB 像素 SHA-256</text>
    <text x="18" y="142" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• PNG 魔数直通 + 256px 缩略图</text>
    <text x="18" y="168" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#5E6678">• 内部回写防循环入库标记</text>
  </g>

  <line x1="529" y1="135" x2="576" y2="135" stroke="#007AFF" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Node 3 -->
  <g transform="translate(582, 36)" filter="url(#boxShadow)">
    <rect width="205" height="198" rx="10" fill="#FFFFFF" stroke="#E2E7F0" stroke-width="1.2"/>
    <text x="102" y="28" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#EA580C">本地持久化存储</text>
    <line x1="16" y1="40" x2="189" y2="40" stroke="#E8EDF5"/>
    <text x="18" y="64" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• SQLite3 WAL 直连存储</text>
    <text x="18" y="90" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• 120ms 防抖即时全文检索</text>
    <text x="18" y="116" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• 置顶永久保护与自动淘汰</text>
    <text x="18" y="142" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• NSCache 分级缩略图缓存</text>
    <text x="18" y="168" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#5E6678">• 100% 本地离线数据私密</text>
  </g>

  <line x1="787" y1="135" x2="834" y2="135" stroke="#007AFF" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Node 4 -->
  <g transform="translate(840, 36)" filter="url(#boxShadow)">
    <rect width="214" height="198" rx="10" fill="#FFFFFF" stroke="#E2E7F0" stroke-width="1.2"/>
    <text x="107" y="28" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#7C3AED">输出回填与贴图交互</text>
    <line x1="16" y1="40" x2="198" y2="40" stroke="#E8EDF5"/>
    <text x="18" y="64" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• CGEvent 合成 ⌘V 直粘</text>
    <text x="18" y="90" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• CmdVMonitor 按序预装推进</text>
    <text x="18" y="116" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• 贴图外智能上下工具栏</text>
    <text x="18" y="142" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#181C24">• Live Text + 离线 OCR 提取</text>
    <text x="18" y="168" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#5E6678">• ⌥+滚轮 大段文本字号缩放</text>
  </g>
</svg>
