name: Build and Package WinPaste (Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag (e.g. v1.2.0) to attach .exe assets'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/WinPaste.sln

      - name: Build solution
        run: dotnet build windows/WinPaste.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test windows/WinPaste.Tests/WinPaste.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish single-file executable (win-x64)
        run: >
          dotnet publish windows/WinPaste.App/WinPaste.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/win-x64

      - name: Ensure Inno Setup and build Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag -and "${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          }
          $ver = if ($tag) { $tag.TrimStart('v') } else { "1.2.0" }

          New-Item -ItemType Directory -Force -Path publish/dist | Out-Null
          Copy-Item publish/win-x64/WinPaste.exe publish/dist/WinPaste.exe -Force
          if ($tag) {
            Copy-Item publish/win-x64/WinPaste.exe "publish/dist/WinPaste-$tag-win-x64.exe" -Force
          }

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }

          & $iscc "/DMyAppVersion=$ver" "/DSourceExe=$(Resolve-Path 'publish\win-x64\WinPaste.exe')" "/DOutputDir=$(Resolve-Path 'publish\dist')" "/DOutputBaseFilename=WinPaste-Setup" "windows\installer\WinPaste.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($tag) {
            Copy-Item publish/dist/WinPaste-Setup.exe "publish/dist/WinPaste-$tag-win-x64-Setup.exe" -Force
          }

      - name: Upload WinPaste Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinPaste-win-x64
          path: publish/dist/
          if-no-files-found: error

      - name: Upload WinPaste release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          gh release upload $tag `
            "publish/dist/WinPaste-$tag-win-x64-Setup.exe" `
            "publish/dist/WinPaste-Setup.exe" `
            "publish/dist/WinPaste-$tag-win-x64.exe" `
            "publish/dist/WinPaste.exe" `
            --clobber
